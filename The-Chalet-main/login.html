<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — Chalet Booking Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pine-dark:#132A22;
    --pine:#20463A;
    --parchment:#EEEBE0;
    --parchment-panel:#F7F5EC;
    --ink:#182420;
    --mist:#7C9289;
    --berry:#7A2E33;
    --berry-soft:#F0DCDA;
    --line:#D8D2C0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--parchment);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--parchment-panel);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 2px 6px rgba(19,42,34,0.08), 0 8px 24px rgba(19,42,34,0.06);
    padding:28px 26px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mist);
    margin:0 0 6px;
  }
  h1{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 20px;
    color:var(--pine-dark);
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--pine-dark);
    margin-bottom:5px;
  }
  .field{margin-bottom:16px;}
  input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
  }
  button{
    width:100%;
    padding:11px 14px;
    border-radius:100px;
    border:none;
    background:var(--pine-dark);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button:hover{background:var(--pine);}
  .error-msg{
    font-size:12.5px;
    color:var(--berry);
    background:var(--berry-soft);
    border:1px solid var(--berry);
    padding:8px 10px;
    border-radius:7px;
    margin-bottom:14px;
    display:none;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Booking Ledger</p>
    <h1>Sign in</h1>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.style.display = 'none';
      try{
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if(res.ok){
          window.location.href = '/';
        } else {
          const data = await res.json().catch(()=>({}));
          errorEl.textContent = data.error || 'Sign in failed.';
          errorEl.style.display = 'block';
        }
      }catch(err){
        errorEl.textContent = 'Could not reach the server. Check your connection.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
